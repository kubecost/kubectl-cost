name: PR - build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-go@v6
        with:
          go-version: ^1.16

      - name: Install govvv
        run: |
          go install github.com/ahmetb/govvv@master

      - uses: actions/checkout@v6

      - name: Make build
        run: |
          make build

      - name: Test
        run: |
          go test -coverprofile=coverage.out ./...

      # name must be coverage-xml for the shared plugin
      - name: Upload coverage for the shared coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.out

  # only on merge to main
  coverage:
    needs: build
    if: github.event_name == 'push'
    uses: Apptio-PNE/code-coverage-report/.github/workflows/coverage.yml@main
    secrets: inherit
